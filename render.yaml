# Render Blueprint — https://render.com/docs/blueprint-spec
# Render dashboard → New → Blueprint → select this repo. Every push to main redeploys.
services:
  - type: web
    name: vimo-api                 # → https://vimo-api.onrender.com (if the name is free)
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ALLOWED_ORIGINS        # comma-separated; your Vercel URL(s)
        value: "*"
