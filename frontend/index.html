<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5048e5" />
    <meta name="description" content="ViMo Studio: predict the next mobile app screen with a generative visual GUI world model." />
    <title>ViMo Studio</title>
    <script>
      // apply saved theme before first paint to avoid a flash
      try {
        const t = localStorage.getItem('vimo.theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
